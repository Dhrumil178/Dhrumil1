<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection Web App</title>
    <link rel="stylesheet" href="style.css">
    <!-- ml5.js Library -->
    <script defer src="https://unpkg.com/ml5@0.12.0/dist/ml5.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Face Detection Web App</h1>
            <p>Real-time face detection from your webcam</p>
        </header>

        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="webcam">🎥 Webcam</button>
            <button class="tab-btn" data-tab="upload">📸 Upload Photo</button>
        </div>

        <div id="webcam-tab" class="tab-content active">
            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Start Webcam</button>
                <button id="stopBtn" class="btn btn-danger" disabled>Stop Webcam</button>
                <span id="status" class="status">Ready</span>
            </div>
        </div>

        <div id="upload-tab" class="tab-content">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
                <div class="upload-placeholder">
                    <div class="upload-icon">📤</div>
                    <p>Click to upload or drag & drop an image</p>
                    <small>Supported: JPG, PNG, GIF, WebP</small>
                </div>
            </div>
            <button id="clearImageBtn" class="btn btn-danger" style="display:none; margin-top: 15px;">Clear Image</button>
        </div>

        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span class="label">Faces Detected:</span>
                <span id="faceCount" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">FPS:</span>
                <span id="fps" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">Model Status:</span>
                <span id="modelStatus" class="value">Loading...</span>
            </div>
        </div>

        <div class="detection-details" id="detectionDetails"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
